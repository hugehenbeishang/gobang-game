<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#gradient)"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 棋盘 -->
  <rect x="120" y="50" width="160" height="160" rx="10" fill="#d4a373"/>
  
  <!-- 网格线 -->
  <g stroke="#000" stroke-width="1">
    <!-- 横线 -->
    <line x1="130" y1="60" x2="270" y2="60"/>
    <line x1="130" y1="80" x2="270" y2="80"/>
    <line x1="130" y1="100" x2="270" y2="100"/>
    <line x1="130" y1="120" x2="270" y2="120"/>
    <line x1="130" y1="140" x2="270" y2="140"/>
    <line x1="130" y1="160" x2="270" y2="160"/>
    <line x1="130" y1="180" x2="270" y2="180"/>
    <line x1="130" y1="200" x2="270" y2="200"/>
    
    <!-- 竖线 -->
    <line x1="130" y1="60" x2="130" y2="200"/>
    <line x1="150" y1="60" x2="150" y2="200"/>
    <line x1="170" y1="60" x2="170" y2="200"/>
    <line x1="190" y1="60" x2="190" y2="200"/>
    <line x1="210" y1="60" x2="210" y2="200"/>
    <line x1="230" y1="60" x2="230" y2="200"/>
    <line x1="250" y1="60" x2="250" y2="200"/>
    <line x1="270" y1="60" x2="270" y2="200"/>
  </g>
  
  <!-- 棋子 -->
  <circle cx="170" cy="100" r="8" fill="#000"/>
  <circle cx="210" cy="140" r="8" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="190" cy="120" r="8" fill="#000"/>
  <circle cx="230" cy="160" r="8" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="150" cy="80" r="8" fill="#000"/>
  
  <!-- 标题 -->
  <text x="200" y="250" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">五子棋对战</text>
  
  <!-- 副标题 -->
  <text x="200" y="275" text-anchor="middle" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)">来和我对弈吧！</text>
</svg>